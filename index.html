<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ev1</title>
  <style>
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a1a;
    }

    .wrapper {
      max-width: 1024px;
      margin: 0 auto;
      padding: 64px 32px;
    }

    .content {
      background: #ffffff;
      border-radius: 8px;
      padding: 48px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2rem;
    }

    p {
      margin: 0;
      line-height: 1.6;
      color: #4a4a4a;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="content">
      <h1>Hello, world!</h1>
      <p>This is ev1, up and running.</p>
    </div>
  </div>
</body>
</html>
